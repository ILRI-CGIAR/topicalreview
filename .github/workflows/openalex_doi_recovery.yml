name: OpenAlex recovery of Lens-unmatched DOIs
on:
  push:
    paths:
      - 'DOI_bibl_lookup/openalex_unmatched_input.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Recover exact DOI metadata from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python DOI_bibl_lookup/openalex_recover.py DOI_bibl_lookup/openalex_unmatched_input.csv recovered_openalex.csv
      - uses: actions/upload-artifact@v4
        with:
          name: openalex-doi-recovery
          path: recovered_openalex.csv
          retention-days: 7
          if-no-files-found: error
